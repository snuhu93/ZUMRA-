name: Build ZUMRA AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install and build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm install
          npm run build

      - name: Add Capacitor and Android
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.zumra.app",
            "appName": "ZUMRA",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Set version code
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Sign AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > zumra.keystore
          cp android/app/build/outputs/bundle/release/app-release.aab zumra-signed.aab
          jarsigner -keystore zumra.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            zumra-signed.aab "$KEY_ALIAS"
          jarsigner -verify zumra-signed.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: zumra-aab
          path: zumra-signed.aab
          retention-days: 7
