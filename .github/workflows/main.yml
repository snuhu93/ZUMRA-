
name: Build ZUMRA AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          echo "=== Checking ZUMRA ZIP ==="
          ls -lh
          test -f "ZUMRA-AAB-Ready.zip"

      - name: Extract ZUMRA project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q "ZUMRA-AAB-Ready.zip" -d project

          echo "=== Extracted project ==="
          find project -maxdepth 5 -type f | sort | head -300

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android project
        run: |
          PROJECT_DIR="$(dirname "$(find project -type f -name gradlew -print -quit)")"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew was not found anywhere inside project/"
            find project -maxdepth 6 -type f | sort | head -500
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Release AAB
        run: |
          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "=== Gradle version ==="
          ./gradlew --version

          echo "=== Building Release AAB ==="
          ./gradlew bundleRelease --stacktrace

      - name: Find generated AAB
        run: |
          echo "=== Generated AAB files ==="
          find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/bundle/*/*.aab" \
            -print

      - name: Upload ZUMRA AAB
        uses: actions/upload-artifact@v4
        with:
          name: ZUMRA-AAB
          path: project/**/build/outputs/bundle/**/*.aab
          if-no-files-found: error
