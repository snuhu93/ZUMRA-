name: Build ZUMRA AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          test -f "ZUMRA-AAB-Ready.zip"
          echo "ZIP found."

      - name: Extract ZUMRA project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q "ZUMRA-AAB-Ready.zip" -d project

          echo "=== Project files ==="
          find project -maxdepth 5 -type f | sort | head -300

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android project
        run: |
          PROJECT_DIR="$(dirname "$(find project -type f -name build.gradle -print -quit)")"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: build.gradle was not found."
            find project -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Release AAB
        run: |
          cd "$PROJECT_DIR"

          echo "=== Gradle version ==="
          gradle --version

          echo "=== Building Release AAB ==="
          gradle bundleRelease --stacktrace

      - name: Find generated AAB
        run: |
          echo "=== Generated AAB files ==="
          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/bundle/*/*.aab" \
            -print

      - name: Upload ZUMRA AAB
        uses: actions/upload-artifact@v4
        with:
          name: ZUMRA-AAB
          path: project/**/build/outputs/bundle/**/*.aab
          if-no-files-found: error
