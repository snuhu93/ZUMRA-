name: Build AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZUMRA AAB Ready ZIP
        run: |
          unzip -o ZUMRA-AAB-Ready.zip -d project

      - name: Find Android project
        run: |
          echo "Searching for Gradle project..."
          find project -name gradlew -type f

      - name: Build Release AAB
        run: |
          PROJECT_DIR=$(dirname "$(find project -name gradlew -type f -print -quit)")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ZUMRA-AAB
          path: project/**/build/outputs/bundle/**/*.aab
